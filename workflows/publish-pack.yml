name: Publier le pack BLIXWOU
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'config/**'
      - 'defaultconfigs/**'
      - 'resourcepacks/**'
      - 'pack.json'
      - 'tools/**'
      - '.github/workflows/publish-pack.yml'
permissions:
  contents: write
concurrency:
  group: blixwou-pack
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generer les empreintes et le manifeste
        run: python tools/build_manifest.py
      - name: Publier le manifeste si le pack est pret
        shell: bash
        run: |
          if [ ! -f manifest.json ]; then
            echo "Pack en preparation : ajoutez les mods puis activez ready dans pack.json."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publier le manifeste BLIXWOU'
          git push origin HEAD:main
